[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "1.0.0"
description = "基于大语言模型的沉浸式角色扮演对话系统"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "httpx==0.25.2",
    "requests==2.34.2",
    "Pillow==12.2.0",
    "openai==1.54.3",
    "psycopg[binary]==3.2.3",
    "chromadb==0.4.22",
    "sentence-transformers==2.3.1",
    "numpy<2.0,>=1.22.5",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "alembic==1.18.5",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "bandit==1.9.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# BLE001: 编排/事件/后台任务中大量故意的宽异常兜底，失败不会影响主流程。
# G201: 保留部分 logger.error(..., exc_info=True) 以满足现有日志格式约定。
extend-ignore = ["BLE001", "G201"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
implicit_optional = true
check_untyped_defs = false
# repository facade 是动态 re-export 包，静态分析无法追踪全部属性；
# 这几类动态/兼容性噪音在此项目中被视为已知项，其余类型错误保持报错。
disable_error_code = [
  "attr-defined",
  "assignment",
  "arg-type",
  "return-value",
  "misc",
  "union-attr",
  "var-annotated",
]

[tool.bandit]
# B608 是大量“由内部常量拼接 where_clause/子查询”的动态 SQL 低置信告警；
# 本仓库已审计这些拼接值不来自用户输入，暂时跳过。其余中高危仍会拦截。
skips = ["B608"]
