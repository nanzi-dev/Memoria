# Alembic configuration for Memoria
#
# Database URL is NOT read from this file; it is sourced from
# memoria.core.config.configs in alembic/env.py.
# The line below is kept commented-out as a placeholder reference.
# sqlalchemy.url = driver://user:pass@localhost/dbname

[alembic]
script_location = alembic
prepend_sys_path = .

# Date-prefixed revision filenames for easier ordering in VCS
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

path_separator = os

[post_write_hooks]
# Uncomment to auto-format generated migrations with ruff:
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
