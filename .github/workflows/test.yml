name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src/memoria

      - name: Run SQLite test suite
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || 'test-key' }}
          LLM_BASE_URL: https://api.deepseek.com/v1
        run: |
          PYTHONPATH=src pytest tests/ -q --tb=short

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: memoria
          POSTGRES_PASSWORD: memoria_dev_pw
          POSTGRES_DB: memoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memoria -d memoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run PostgreSQL integration tests
        env:
          MEMORIA_PG_TEST_URL: postgresql+psycopg://memoria:memoria_dev_pw@127.0.0.1:5432/memoria_test
          LLM_API_KEY: test-key
          LLM_BASE_URL: https://api.deepseek.com/v1
        run: |
          PYTHONPATH=src pytest tests/ -q --tb=short

  schema:
    name: Alembic schema check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify migrations match ORM models
        env:
          DATABASE_PATH: /tmp/memoria_alembic_check.db
          LLM_API_KEY: test-key
        run: |
          PYTHONPATH=src alembic upgrade head
          PYTHONPATH=src alembic check

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
